        function Modal(hader = '', messagge = '') {
            const a = document.querySelector('.modal')



            const modal = document.createElement('div')
            modal.className = 'modal'
            modal.innerHTML = `
                <div class="hader">${hader}<a href="#"><i>X</i></a></div>

                this.close()
            })
