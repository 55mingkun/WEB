        body {

            height: 8000px;

        @keyframes planetScroll {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(30px);
            }
        }

        @keyframes satelliteScroll {
            0% {
                transform: rotate3d(0, 0, 1, 0);
            }

            100% {
                transform: rotate3d(0, 0, 1, -45deg);
            }
        }

        .back {
            top: 0;
            z-index: -2;
            width: 100%;
            height: 100%;
            min-width: 1200px;
            position: fixed;
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        video {
            width: 100%;
            min-width: 1200px;
            object-fit: cover;
            position: fixed;
            z-index: -1;
        }

        .bak-img {
            position: fixed;
            z-index: -1;
        }

        .planet1 {
            width: 15%;
            right: 160px;
            bottom: 10px;
            animation: planetScroll 5s infinite alternate;
        }

        .satellite {

            width: 8%;
            left: 800px;
            top: 200px;
            animation: satelliteScroll 5s infinite alternate;

            left: 300px;
            top: 200px;
