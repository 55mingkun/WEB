    <script>
        //
        //做一个防抖函数
        const debounce = function (fun, counting, a = 0) {

            var change = null
            return function () {
                if (change === null) {
                    
                    change = setTimeout(fun, counting)
                    if(a === 0){
                        clearTimeout(change)
                        a = 1
                    }
                } else {
                    clearTimeout(change)
                    change = setTimeout(fun, counting)
                }
            }

        }


        //为视口绑定滚动事件



        var getScrollTop = function () {
            var scrollTop = document.documentElement.scrollTop
            console.log(this)
        }
        window.onscroll = debounce(getScrollTop, 500)


    </script>
