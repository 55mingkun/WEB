    <script>
        //做一个节流阀

        function throttle(fun, counting, a = 0){
            let change = null
            return function(){
                if(change !== null || a === 0){
                    a = 1
                    return
                }else{
                    change = setTimeout(function(){
                        fun()
                        change = null
                     },counting) 
                }
                
            }
        }
