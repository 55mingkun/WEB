    <style>
        * {

            margin: 0;

        a {
            text-decoration: none;

        ul {

        main {
            width: 1300px;
            background-color: #fff;
            margin: 150px auto 0;
        }

        /*
           UL 宽度 256上下内间距8PX  背景颜色#F7F7F7
            选中内颜色FF5000 /是21*32
        */
        .nav {
            width: 256px;
            
        }

        /*f7是UL的背景颜色*/
        .nav ul {
            width: 100%;
            background-color: #F7F7F7;
            padding: 8px 0;
            border-radius: 15px 0 0 15px;
        }

        .nav li {
            height: 32px;
            font-size: 14px;
            color: #140707;
            line-height: 32px;
            margin-left: 8px;
            padding-left: 10px;
            transition: all .5s;
        }
        .nav li:hover{
            background-color: #fff;
        }
        .nav li:first-child{
            color: #f55050;
        }
        .nav a{
            color: #140707;
            font-size: 14px;
        }
        .nav a:hover{
            color: #E95F18;
        }
        .nav h4 {
            display: inline;
            color: #E95F18;
        }
        .nav span{
            display:inline-block;
            width: 21px;
            text-align: center;
        }
    </style>
</head>
