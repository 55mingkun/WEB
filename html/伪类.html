<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .box{
            width: 200px;
            height: 200px;
            background-color: aqua;
            padding: 1px;
            position: relative;
        }
        
        .box1{
            width: 100px;
            height: 100px;
            background-color: brown;
            position: relative;
        }

        .box1:hover +.box2,
        .box2:hover{
            display: block;
        }

        .box2{
            width: 100px;
            height: 100px;
            background-color: blueviolet;
            display: none;
            position: absolute;
            left: 20px;
            bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
    <div class="box">
        
        <div class="box1"></div>
        <div class="box2"></div>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1><h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>

        <h1>5555</h1><h1>5555</h1>
        <h1>5555</h1>
        <h1>5555</h1>

    </div>
</body>
</html>
